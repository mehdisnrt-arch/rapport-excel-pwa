<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Diagnostic Sync V19</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
    main{max-width:760px;margin:0 auto;padding:24px}
    .card{background:#fff;border:1px solid #cbd5e1;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    h1{margin-top:0}.ok{color:#047857}.err{color:#b91c1c}.warn{color:#a16207}
    input{width:100%;padding:12px;border:1px solid #94a3b8;border-radius:10px;box-sizing:border-box;margin:8px 0 12px}
    button{padding:12px 16px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:700}
    #status{white-space:pre-wrap;font-weight:700;line-height:1.55;margin-top:16px;padding:14px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0}
    code{word-break:break-all}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1 class="ok">PAGE V19 LOADED</h1>
    <p>هذه صفحة فحص مستقلة. إذا ظهر هذا العنوان فالنسخة الجديدة وصلت.</p>
    <label for="apiUrl"><strong>Apps Script URL</strong></label>
    <input id="apiUrl" type="url">
    <button id="testBtn" type="button">TESTER MAINTENANT</button>
    <div id="status" class="warn">Préparation du test...</div>
  </div>
</main>
<script>
(function(){
  'use strict';
  var DEFAULT_URL='https://script.google.com/macros/s/AKfycbxI66qHAU91KW4YP0KjQqkiMFX8WbzQ3cRqXmASemOpcSV2HVi6OeeZoKA4qJFKSyI0sg/exec';
  var SETTINGS_KEY='rapport.excel.settings.v4.final.centres';
  var input=document.getElementById('apiUrl');
  var status=document.getElementById('status');
  var button=document.getElementById('testBtn');

  function savedUrl(){
    try{
      var data=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');
      return String(data.apiUrl||DEFAULT_URL).trim();
    }catch(e){return DEFAULT_URL;}
  }
  function setStatus(text,cls){status.textContent=text;status.className=cls||'';}
  function jsonp(apiUrl,action,timeout){
    return new Promise(function(resolve,reject){
      var callback='syncCheckV19_'+Date.now()+'_'+Math.random().toString(16).slice(2);
      var url;
      try{url=new URL(apiUrl);}catch(e){reject(new Error('URL invalide'));return;}
      url.searchParams.set('action',action);
      url.searchParams.set('callback',callback);
      url.searchParams.set('_t',String(Date.now()));
      var script=document.createElement('script');
      var done=false;
      var timer=setTimeout(function(){finish(new Error('TIMEOUT '+action));},timeout||20000);
      function finish(err,data){
        if(done)return;done=true;clearTimeout(timer);
        try{delete window[callback];}catch(e){window[callback]=undefined;}
        if(script.parentNode)script.parentNode.removeChild(script);
        if(err)reject(err);else resolve(data);
      }
      window[callback]=function(data){finish(null,data);};
      script.onerror=function(){finish(new Error('CONNEXION IMPOSSIBLE '+action));};
      script.src=url.toString();
      document.head.appendChild(script);
    });
  }
  async function run(){
    var api=String(input.value||'').trim();
    if(!api){setStatus('ERREUR: Apps Script URL vide.','err');return;}
    if(!/\/exec\/?(?:\?|$)/i.test(api)){setStatus('ERREUR: le lien doit terminer par /exec.','err');return;}
    button.disabled=true;
    try{
      setStatus('1/3 PING EN COURS...','warn');
      var ping=await jsonp(api,'ping',22000);
      setStatus('2/3 PING OK\nVersion: '+String((ping&&ping.version)||'sans version')+'\nSETUP EN COURS...','warn');
      var setup=await jsonp(api,'setup',30000);
      if(!setup||setup.ok!==true)throw new Error('SETUP REFUSÉ: '+String((setup&&setup.error)||'réponse inconnue'));
      setStatus('3/3 SETUP OK\nLISTREPORTS EN COURS...','warn');
      var list=await jsonp(api,'listReports',30000);
      if(!list||list.ok!==true)throw new Error('LISTREPORTS REFUSÉ: '+String((list&&list.error)||'réponse inconnue'));
      setStatus('SYNC CONNECTION OK\nVersion: '+String(list.version||ping.version||'')+'\nRapports cloud: '+String((list.reports||[]).length),'ok');
    }catch(e){
      setStatus('ÉCHEC: '+String(e&&e.message||e)+'\n\nVérifie Apps Script: Deploy > Manage deployments > Edit > New version > Execute as Me > Who has access: Anyone.','err');
    }finally{button.disabled=false;}
  }
  input.value=savedUrl();
  button.addEventListener('click',run);
  setTimeout(run,500);
})();
</script>
</body>
</html>
